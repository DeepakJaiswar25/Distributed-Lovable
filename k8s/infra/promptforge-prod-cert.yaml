apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: promptforge-prod-cert
  namespace: lovable-core
spec:
  secretName: promptforge-tls
  issuerRef:
    name: letsencrypt-namecom-prod
    kind: ClusterIssuer
  dnsNames:
    - promptforge.deepakjaiswar.dev
    - api.promptforge.deepakjaiswar.dev
    - "*.previews.promptforge.deepakjaiswar.dev"