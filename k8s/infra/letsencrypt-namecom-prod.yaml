apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-namecom-prod
spec:
  acme:
    email: deepakj2597@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
