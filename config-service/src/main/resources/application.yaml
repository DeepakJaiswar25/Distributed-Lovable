spring:
  application:
    name: config-service

  cloud:
    config:
      server:
        git:
          uri: https://github.com/DeepakJaiswar25/Distributed-Lovable-Config-Server
          username: deepakjaiswar25
          password: ${GITHUB_TOKEN}
          default-label: main
server:
  port: 8888

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    config:
      enabled: false

---

spring:
  config:
    activate:
      on-profile: k8s

  cloud:
    config:
      server:
        git:
          uri: https://github.com/DeepakJaiswar25/Distributed-Lovable-Config-Server
          username: ${GIT_USERNAME}
          password: ${GIT_PASSWORD}
          default-label: main

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

